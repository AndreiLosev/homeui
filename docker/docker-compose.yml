services:
  homeui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
      - "1883:1883"
      - "18883:18883"
    volumes:
      - homeui-data:/var/lib/wb-homeui
      - homeui-data:/var/lib/wirenboard/db
    restart: unless-stopped

volumes:
  homeui-data:
