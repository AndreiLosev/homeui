# Native MQTT for wb_common.MQTTClient in wb-homeui-backend
# 0.0.0.0 allows direct connections from the host via docker port mapping
listener 1883 0.0.0.0
allow_anonymous true

# Legacy WebSocket (default upstream when no users / no Wb-User-Type).
# 0.0.0.0 — dev docker stand only: host can connect via published port 18883.
listener 18883 0.0.0.0
protocol websockets
allow_anonymous true

# User role
listener 18884 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /usr/share/wb-mqtt-homeui/mosquitto/acl/user.conf

# Operator role
listener 18885 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /usr/share/wb-mqtt-homeui/mosquitto/acl/operator.conf

# Admin role (no ACL — full access)
listener 18886 127.0.0.1
protocol websockets
allow_anonymous true
